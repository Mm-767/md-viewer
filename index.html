<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: https: http:; font-src 'self' data:">
<title>MD Viewer</title>
<link rel="stylesheet" href="dist/github-markdown.css">
<link rel="stylesheet" href="dist/katex/katex.min.css">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fcfbf9; --pane: #f5f4f0; --surface: #f1efe9; --line: #e4e1da;
    --fg: #1f1f1f; --muted: #6b6a66; --faint: #a9a69e; --accent: #c4552d;
    --code-bg: #efece6; --table-head: #f1efe9; --table-cell: #fbfaf7;
    --selection: rgba(196, 85, 45, 0.18); --active-line: rgba(0, 0, 0, 0.03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #212121; --pane: #1b1b1b; --surface: #171717; --line: #343434;
      --fg: #ececec; --muted: #a3a3a3; --faint: #5f5f5f; --accent: #e8845c;
      --code-bg: #2e2e2e; --table-head: #353535; --table-cell: #2a2a2a;
      --selection: rgba(232, 132, 92, 0.25); --active-line: rgba(255, 255, 255, 0.035);
    }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  #app { display: flex; height: 100vh; }

  #editor-pane { display: none; flex: 1 1 50%; min-width: 0; flex-direction: column; background: var(--pane); border-right: 1px solid var(--line); }
  body.editing #editor-pane { display: flex; }
  #toolbar { display: flex; align-items: center; gap: 2px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #toolbar button { width: 34px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: none; color: var(--muted); font: 700 15px/1 Georgia, serif; cursor: pointer; }
  #toolbar button:hover { background: var(--line); color: var(--fg); }
  #toolbar sub { font-size: 10px; }
  #toolbar svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sep { width: 1px; height: 18px; margin: 0 6px; background: var(--line); }
  #lang-picker { position: fixed; z-index: 20; width: 220px; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); }
  #lang-picker[hidden] { display: none; }
  #lang-search { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--pane); color: var(--fg); font-size: 13px; outline: none; }
  #lang-search:focus { border-color: var(--accent); }
  #lang-list { max-height: 260px; margin: 6px 0 0; padding: 0; overflow-y: auto; list-style: none; }
  #lang-list li { padding: 6px 9px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  #lang-list li:hover { background: var(--pane); }
  #lang-list li.active { background: var(--accent); color: #fff; }
  #editor { flex: 1; min-height: 0; }
  #editor .cm-editor { height: 100%; font-size: 14.5px; }
  #editor .cm-editor.cm-focused { outline: none; }
  #editor .cm-scroller { font-family: ui-monospace, "SF Mono", Menlo, monospace; line-height: 1.6; }
  #editor .cm-content { padding: 16px 8px; }
  #editor .cm-image-data { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px 1px 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--muted); font: 12px -apple-system, sans-serif; vertical-align: middle; }
  #editor .cm-image-data img { width: 22px; height: 22px; object-fit: cover; border-radius: 4px; }

  #preview { flex: 1 1 50%; min-width: 0; overflow: auto; position: relative; }
  .markdown-body {
    max-width: 860px; margin: 0 auto; padding: 56px 40px 40vh; box-sizing: border-box;
    font-size: 16px; line-height: 1.75;
    /* github-markdown-css reads its colors from these; point them at the app palette. */
    --bgColor-default: var(--bg); --bgColor-muted: var(--surface); --bgColor-neutral-muted: var(--code-bg);
    --borderColor-default: var(--line); --borderColor-muted: var(--line);
    --fgColor-default: var(--fg); --fgColor-muted: var(--muted); --fgColor-accent: var(--accent);
  }
  .markdown-body h1, .markdown-body h2 { padding-bottom: 0; border-bottom: 0; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { margin-top: 1.8em; font-weight: 700; letter-spacing: -0.01em; }
  .markdown-body hr { height: 1px; margin: 2.5em 0; border: 0; background: var(--line); }
  .markdown-body blockquote { border-left: 3px solid var(--line); color: var(--muted); }
  .markdown-body :not(pre) > code { padding: 0.15em 0.45em; border-radius: 6px; background: var(--code-bg); color: var(--accent); font-size: 0.88em; }
  .markdown-body pre.shiki { padding: 28px 32px; border-radius: 14px; background: var(--surface) !important; font-size: 14px; line-height: 1.75; overflow-x: auto; }
  .markdown-body pre.shiki code { background: transparent; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .markdown-body .shiki, .markdown-body .shiki span { color: var(--shiki-light); }
  @media (prefers-color-scheme: dark) {
    .markdown-body .shiki, .markdown-body .shiki span { color: var(--shiki-dark); }
  }
  .markdown-body table { display: table; width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .markdown-body table tr { border-top: 0; background: transparent; }
  .markdown-body table th, .markdown-body table td { padding: 12px 16px; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .markdown-body table tr > :last-child { border-right: 0; }
  .markdown-body table tr:last-child > td { border-bottom: 0; }
  .markdown-body table th { background: var(--table-head); font-size: 0.94em; font-weight: 600; }
  .markdown-body table td { background: var(--table-cell); }
  .markdown-body .mermaid { margin-bottom: 16px; text-align: center; }
  .markdown-body .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }

  #mode-btn { position: fixed; top: 12px; right: 20px; z-index: 10; padding: 6px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg); color: var(--fg); font-size: 13px; font-weight: 600; cursor: pointer; }
  #mode-btn:hover { border-color: var(--accent); color: var(--accent); }

  @media print {
    #editor-pane, #mode-btn { display: none !important; }
    html, body, #app, #preview { display: block; height: auto; overflow: visible; background: #fff; }
    .markdown-body { max-width: none; padding: 0; --bgColor-default: #fff; }
  }
</style>
</head>
<body>
<div id="app">
  <section id="editor-pane">
    <div id="toolbar">
      <button data-cmd="h1" title="제목 1 (⌘1)">H<sub>1</sub></button>
      <button data-cmd="h2" title="제목 2 (⌘2)">H<sub>2</sub></button>
      <button data-cmd="h3" title="제목 3 (⌘3)">H<sub>3</sub></button>
      <button data-cmd="h4" title="제목 4 (⌘4)">H<sub>4</sub></button>
      <span class="sep"></span>
      <button data-cmd="bold" title="굵게 (⌘B)">B</button>
      <button data-cmd="italic" title="기울임 (⌘I)"><i>I</i></button>
      <button data-cmd="strike" title="취소선 (⇧⌘X)"><s>S</s></button>
      <button data-cmd="inlineCode" title="인라인 코드 (⇧⌘C)"><svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg></button>
      <span class="sep"></span>
      <button data-cmd="quote" title="인용 (⌥⌘Q)"><svg viewBox="0 0 24 24"><path d="M7 7h4v4c0 3-2 5-4 6M14 7h4v4c0 3-2 5-4 6"/></svg></button>
      <button data-cmd="link" title="링크 (⌘K)"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg></button>
      <button data-cmd="image" title="이미지 (⇧⌘I)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></button>
      <button data-cmd="codeBlock" title="코드블록 (⌥⌘C)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 9-3 3 3 3M14 9l3 3-3 3"/></svg></button>
    </div>
    <div id="lang-picker" hidden>
      <input id="lang-search" placeholder="언어 검색…" spellcheck="false" autocomplete="off">
      <ul id="lang-list"></ul>
    </div>
    <div id="editor"></div>
  </section>
  <main id="preview"><article class="markdown-body"></article></main>
</div>
<button id="mode-btn">편집</button>
<input id="image-input" type="file" accept="image/*" hidden>
<script src="dist/renderer.js"></script>
</body>
</html>
